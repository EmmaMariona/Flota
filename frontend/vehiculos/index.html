<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Vehículos - Gestión de Flota</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/flota/frontend/assets/css/estilo.css">
</head>
<body class="bg-body-tertiary">

<div class="d-flex min-vh-100 layout-wrapper">
    <div id="sidebar-container"></div>
    <div class="d-flex flex-column flex-grow-1 main-content-wrapper">
        <div id="navbar-container"></div>
        <main class="container-fluid p-4 content-area">
            <div id="alerts-container"></div>

            <div class="d-flex flex-column gap-4">
                <!-- Encabezado de Página -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                    <div>
                        <h2 class="fw-bold mb-1">Inventario de Vehículos</h2>
                        <p class="text-secondary small mb-0">Gestión de unidades, asignación a sucursales, ficha técnica y documentación.</p>
                    </div>
                    <div class="requires-edit" style="display: none;">
                        <a href="/flota/frontend/vehiculos/crear.html?v=20260927" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm">
                            <i class="bi bi-plus-circle"></i> Nuevo Vehículo
                        </a>
                    </div>
                </div>

                <!-- Barra de Filtros y Búsqueda -->
                <div class="card p-3 shadow-sm">
                    <form id="formFiltros" class="row g-2 align-items-end">
                        <div class="col-12 col-md-4">
                            <label class="form-label small text-secondary">Búsqueda rápida</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" id="filtro-buscar" class="form-control" placeholder="Buscar por placa, marca, modelo, VIN...">
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <label class="form-label small text-secondary">Sucursal</label>
                            <select id="filtro-sucursal" class="form-select form-select-sm">
                                <option value="">Todas las sucursales</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <label class="form-label small text-secondary">Estado</label>
                            <select id="filtro-estado" class="form-select form-select-sm">
                                <option value="">Todos los estados</option>
                                <option value="Activo">Activo (En operación)</option>
                                <option value="Taller">Taller (En mantenimiento)</option>
                                <option value="Inactivo">Inactivo (Fuera de servicio)</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100 fw-semibold">
                                <i class="bi bi-filter"></i> Filtrar
                            </button>
                            <button type="button" id="btnLimpiar" class="btn btn-outline-secondary btn-sm" title="Limpiar filtros">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Tabla de Vehículos -->
                <div class="card shadow-sm">
                    <div class="card-header bg-dark border-bottom border-secondary border-opacity-25 d-flex justify-content-between align-items-center py-3">
                        <div class="d-flex align-items-center gap-2">
                            <span class="fw-semibold text-light d-flex align-items-center gap-2">
                                <i class="bi bi-truck text-primary"></i> Unidades Registradas
                            </span>
                            <small class="text-secondary d-none d-sm-inline ms-2">
                                <i class="bi bi-info-circle"></i> Doble clic en una fila para ver el detalle
                            </small>
                        </div>
                        <span class="badge bg-secondary-subtle text-secondary" id="total-registros">0 vehículos</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-custom table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Placa</th>
                                    <th>Sucursal</th>
                                    <th>Marca y Modelo</th>
                                    <th>Año / Tipo</th>
                                    <th>Kilometraje</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-vehiculos">
                                <tr>
                                    <td colspan="6" class="text-center text-secondary py-5">
                                        <div class="spinner-border spinner-border-sm me-2 text-primary" role="status"></div>
                                        Cargando inventario de vehículos...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/flota/frontend/assets/js/app.js?v=20260927"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await App.initLayout('vehiculos');
    if (!ok) return;

    // Cargar sucursales en el selector
    const resSuc = await App.api('/flota/backend/controllers/SucursalController.php?accion=listar');
    if (resSuc && resSuc.success && resSuc.data) {
        const select = document.getElementById('filtro-sucursal');
        select.innerHTML = '<option value="">Todas las sucursales</option>' + 
            resSuc.data.map(s => `<option value="${s.id}">${App.escapeHtml(s.nombre)}</option>`).join('');
    }

    async function cargarVehiculos() {
        const buscar = document.getElementById('filtro-buscar').value.trim();
        const sucursal_id = document.getElementById('filtro-sucursal').value;
        const estado = document.getElementById('filtro-estado').value;

        const params = new URLSearchParams();
        params.append('accion', 'listar');
        if (buscar) params.append('buscar', buscar);
        if (sucursal_id) params.append('sucursal_id', sucursal_id);
        if (estado) params.append('estado', estado);

        const res = await App.api(`/flota/backend/controllers/VehiculoController.php?${params.toString()}`);
        const tbody = document.getElementById('tabla-vehiculos');
        const countBadge = document.getElementById('total-registros');

        if (res && res.success && res.data) {
            const list = res.data.vehiculos || [];

            countBadge.textContent = `${list.length} vehículo${list.length !== 1 ? 's' : ''}`;

            if (list.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-secondary py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                            No se encontraron vehículos con los criterios seleccionados.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = list.map(v => {
                let badgeClase = 'badge-activo';
                if (v.estado === 'Taller') badgeClase = 'badge-taller';
                if (v.estado === 'Inactivo') badgeClase = 'badge-inactivo';

                return `
                <tr class="fila-vehiculo" data-id="${v.id}" style="cursor: pointer; user-select: none;" title="Doble clic para ver el detalle de la unidad ${App.escapeHtml(v.placa)}">
                    <td>
                        <span class="fw-bold text-info fs-6">
                            ${App.escapeHtml(v.placa)}
                        </span>
                    </td>
                    <td>
                        <span class="badge bg-secondary-subtle text-light border border-secondary border-opacity-50">
                            <i class="bi bi-geo-alt me-1"></i>${App.escapeHtml(v.sucursal || 'Sin sucursal')}
                        </span>
                    </td>
                    <td>
                        <div class="fw-semibold text-light">${App.escapeHtml((v.marca || '') + ' ' + (v.modelo || ''))}</div>
                        ${v.vin ? `<small class="text-secondary">VIN: ${App.escapeHtml(v.vin)}</small>` : ''}
                    </td>
                    <td>
                        <div>${App.escapeHtml(v.anio || 'N/A')}</div>
                        <small class="text-secondary">${App.escapeHtml(v.tipo || 'Camión')}</small>
                    </td>
                    <td>
                        <span class="fw-semibold">${Number(v.kilometraje_actual || 0).toLocaleString()} km</span>
                    </td>
                    <td>
                        <span class="badge ${badgeClase} px-2 py-1">${App.escapeHtml(v.estado)}</span>
                    </td>
                </tr>
                `;
            }).join('');

            // Navegar al detalle de la unidad al hacer doble clic en la fila
            tbody.querySelectorAll('.fila-vehiculo').forEach(fila => {
                fila.addEventListener('dblclick', () => {
                    const id = fila.getAttribute('data-id');
                    if (id) {
                        window.location.href = `/flota/frontend/vehiculos/detalle.html?id=${id}`;
                    }
                });
            });
        }
    }

    // Cargar inicial
    cargarVehiculos();

    // Filtros
    document.getElementById('formFiltros').addEventListener('submit', (e) => {
        e.preventDefault();
        cargarVehiculos();
    });

    document.getElementById('btnLimpiar').addEventListener('click', () => {
        document.getElementById('filtro-buscar').value = '';
        document.getElementById('filtro-sucursal').value = '';
        document.getElementById('filtro-estado').value = '';
        cargarVehiculos();
    });
});
</script>
</body>
</html>
