<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Llanta - Gestión de Flota</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/flota/frontend/assets/css/estilo.css">
</head>
<body class="bg-body-tertiary">

<div class="d-flex min-vh-100 layout-wrapper">
    <div id="sidebar-container"></div>
    <div class="d-flex flex-column flex-grow-1 main-content-wrapper">
        <div id="navbar-container"></div>
        <main class="container-fluid p-4 content-area">
            <div id="alerts-container"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-xl-10">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold mb-1">Registrar / Asignar Llanta</h2>
                            <p class="text-secondary small mb-0">Asigna un nuevo neumático a una unidad y posición específica de la flota.</p>
                        </div>
                        <a href="/flota/frontend/llantas/index.html" class="btn btn-outline-secondary d-flex align-items-center gap-1">
                            <i class="bi bi-arrow-left"></i> Volver a Llantas
                        </a>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <form id="formRegistrarLlanta">
                                <h5 class="fw-semibold text-info mb-3"><i class="bi bi-truck me-2"></i>Asignación de Vehículo y Posición</h5>
                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Vehículo / Camión <span class="text-danger">*</span></label>
                                        <select name="vehiculo_id" id="vehiculo_id" class="form-select" required>
                                            <option value="">-- Selecciona el camión --</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Posición del Neumático <span class="text-danger">*</span></label>
                                        <select name="posicion_id" id="posicion_id" class="form-select" required>
                                            <option value="">-- Selecciona la posición --</option>
                                        </select>
                                    </div>
                                </div>

                                <h5 class="fw-semibold text-info mb-3"><i class="bi bi-record-circle me-2"></i>Especificaciones del Neumático</h5>
                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Código Único / Serie <span class="text-danger">*</span></label>
                                        <input type="text" name="codigo" class="form-control text-uppercase fw-bold" placeholder="Ej. LL-0158" required autofocus>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Marca</label>
                                        <input type="text" name="marca" class="form-control" placeholder="Ej. Michelin, Bridgestone, Goodyear">
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Medida</label>
                                        <input type="text" name="medida" class="form-control" placeholder="Ej. 295/80R22.5">
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Tipo de Llanta</label>
                                        <select name="tipo_llanta" class="form-select">
                                            <option value="Toda posición">Toda posición (Mixta)</option>
                                            <option value="Tracción">Tracción</option>
                                            <option value="Direccional">Direccional</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Estado Inicial</label>
                                        <select name="estado" class="form-select">
                                            <option value="Activa" selected>Activa (Instalada)</option>
                                            <option value="Por cambiar">Por cambiar</option>
                                            <option value="Desechada">Desechada</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Código Llanta Reemplazada</label>
                                        <input type="text" name="codigo_anterior" class="form-control text-uppercase" placeholder="Opcional (Ej. LL-0042)">
                                    </div>
                                </div>

                                <h5 class="fw-semibold text-info mb-3"><i class="bi bi-speedometer2 me-2"></i>Instalación y Costo</h5>
                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Fecha de Instalación</label>
                                        <input type="date" name="fecha_instalacion" id="fecha_instalacion" class="form-control">
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Kilometraje al Instalar</label>
                                        <div class="input-group">
                                            <input type="number" name="km_instalacion" id="km_instalacion" class="form-control" value="0" min="0">
                                            <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">km</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Costo de la Llanta (Lps)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">L.</span>
                                            <input type="number" step="0.01" name="costo" class="form-control" value="0.00" min="0">
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Observaciones</label>
                                        <textarea name="observaciones" class="form-control" rows="2" placeholder="Proveedor, garantía, notas técnicas..."></textarea>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-25">
                                    <a href="/flota/frontend/llantas/index.html" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" id="btnGuardar" class="btn btn-info px-4 fw-semibold text-dark">
                                        <i class="bi bi-save me-1"></i> Asignar Llanta
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/flota/frontend/assets/js/app.js?v=20260927"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await App.initLayout('llantas');
    if (!ok) return;

    document.getElementById('fecha_instalacion').value = new Date().toISOString().split('T')[0];

    const preVehiculoId = new URLSearchParams(window.location.search).get('vehiculo_id');

    const [resVeh, resPos] = await Promise.all([
        App.api('/flota/backend/controllers/VehiculoController.php?accion=listar'),
        App.api('/flota/backend/controllers/LlantaController.php?accion=posiciones')
    ]);

    if (resPos && resPos.success && resPos.data) {
        document.getElementById('posicion_id').innerHTML = '<option value="">-- Selecciona la posición --</option>' + 
            resPos.data.map(p => `<option value="${p.id}">${App.escapeHtml(p.nombre)} (${App.escapeHtml(p.eje)})</option>`).join('');
    }

    if (resVeh && resVeh.success && resVeh.data && resVeh.data.vehiculos) {
        const selectV = document.getElementById('vehiculo_id');
        selectV.innerHTML = '<option value="">-- Selecciona el camión --</option>' + 
            resVeh.data.vehiculos.map(v => `
                <option value="${v.id}" data-km="${v.kilometraje_actual || 0}" ${preVehiculoId == v.id ? 'selected' : ''}>
                    ${App.escapeHtml(v.placa)} | ${App.escapeHtml(v.marca || '')} ${App.escapeHtml(v.modelo || '')}
                </option>
            `).join('');

        selectV.addEventListener('change', () => {
            const opt = selectV.options[selectV.selectedIndex];
            if (opt) {
                const km = opt.getAttribute('data-km');
                if (km) document.getElementById('km_instalacion').value = km;
            }
        });

        if (preVehiculoId) {
            selectV.dispatchEvent(new Event('change'));
        }
    }

    const form = document.getElementById('formRegistrarLlanta');
    const btnGuardar = document.getElementById('btnGuardar');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btnGuardar.disabled = true;
        btnGuardar.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Guardando...`;

        const formData = new FormData(form);
        formData.append('accion', 'guardar');

        try {
            const res = await fetch('/flota/backend/controllers/LlantaController.php?accion=guardar', {
                method: 'POST',
                body: formData,
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json' }
            });
            const data = await res.json();

            if (data && data.success) {
                App.flashAlert('success', data.mensaje || 'Llanta asignada exitosamente.');
                window.location.href = '/flota/frontend/llantas/index.html';
            } else {
                App.showAlert('danger', data.mensaje || 'Error al asignar llanta.');
                btnGuardar.disabled = false;
                btnGuardar.innerHTML = `<i class="bi bi-save me-1"></i> Asignar Llanta`;
            }
        } catch (err) {
            console.error(err);
            App.showAlert('danger', 'Error de conexión con el servidor.');
            btnGuardar.disabled = false;
            btnGuardar.innerHTML = `<i class="bi bi-save me-1"></i> Asignar Llanta`;
        }
    });
});
</script>
</body>
</html>
