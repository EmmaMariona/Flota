<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Mantenimiento - Gestión de Flota</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/flota/frontend/assets/css/estilo.css">
</head>
<body class="bg-body-tertiary">

<div class="d-flex min-vh-100 layout-wrapper">
    <div id="sidebar-container"></div>
    <div class="d-flex flex-column flex-grow-1 main-content-wrapper">
        <div id="navbar-container"></div>
        <main class="container-fluid p-4 content-area">
            <div id="alerts-container"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-xl-10">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold mb-1">Editar Mantenimiento #<span id="lbl-id">--</span></h2>
                            <p class="text-secondary small mb-0">Actualiza los datos técnicos, costos o estado de la orden de servicio.</p>
                        </div>
                        <a href="/flota/frontend/mantenimientos/index.html" class="btn btn-outline-secondary d-flex align-items-center gap-1">
                            <i class="bi bi-arrow-left"></i> Volver a la Lista
                        </a>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <form id="formEditarMantenimiento" enctype="multipart/form-data">
                                <input type="hidden" name="id" id="mant-id">
                                <h5 class="fw-semibold text-warning mb-3"><i class="bi bi-truck me-2"></i>Asignación de Unidad y Sucursal</h5>
                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Vehículo <span class="text-danger">*</span></label>
                                        <select name="vehiculo_id" id="vehiculo_id" class="form-select" required></select>
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <label class="form-label">Sucursal de Mantenimiento <span class="text-danger">*</span></label>
                                        <select name="sucursal_id" id="sucursal_id" class="form-select" required></select>
                                    </div>
                                    <div class="col-6 col-md-2">
                                        <label class="form-label">Tipo de Servicio <span class="text-danger">*</span></label>
                                        <select name="tipo" id="tipo" class="form-select" required>
                                            <option value="Preventivo">Preventivo (Rutina)</option>
                                            <option value="Correctivo">Correctivo (Reparación)</option>
                                        </select>
                                    </div>
                                    <div class="col-6 col-md-2">
                                        <label class="form-label">Estado <span class="text-danger">*</span></label>
                                        <select name="estado" id="estado" class="form-select" required>
                                            <option value="Programado">Programado</option>
                                            <option value="En proceso">En proceso (Taller)</option>
                                            <option value="Completado">Completado</option>
                                            <option value="Cancelado">Cancelado</option>
                                        </select>
                                    </div>
                                </div>

                                <h5 class="fw-semibold text-warning mb-3"><i class="bi bi-card-text me-2"></i>Detalles del Servicio</h5>
                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Título del Mantenimiento <span class="text-danger">*</span></label>
                                        <input type="text" name="titulo" id="titulo" class="form-control" required>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Taller / Proveedor Encargado</label>
                                        <input type="text" name="proveedor" id="proveedor" class="form-control">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Descripción de Trabajos y Repuestos</label>
                                        <textarea name="descripcion" id="descripcion" class="form-control" rows="3"></textarea>
                                    </div>
                                </div>

                                <h5 class="fw-semibold text-warning mb-3"><i class="bi bi-calendar3 me-2"></i>Fechas, Kilometraje e Inversión</h5>
                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-3">
                                        <label class="form-label">Fecha Programada <span class="text-danger">*</span></label>
                                        <input type="date" name="fecha_programada" id="fecha_programada" class="form-control" required>
                                    </div>
                                    <div class="col-12 col-md-3">
                                        <label class="form-label">Fecha de Realización</label>
                                        <input type="date" name="fecha_realizada" id="fecha_realizada" class="form-control">
                                    </div>
                                    <div class="col-12 col-md-3">
                                        <label class="form-label">Kilometraje al Servicio</label>
                                        <div class="input-group">
                                            <input type="number" name="kilometraje_servicio" id="kilometraje_servicio" class="form-control" min="0">
                                            <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">km</span>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-3">
                                        <label class="form-label">Costo Incurrido / Total (Lps)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">L.</span>
                                            <input type="number" step="0.01" name="costo" id="costo" class="form-control" min="0">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Observaciones Adicionales / Garantía</label>
                                        <input type="text" name="observaciones" id="observaciones" class="form-control">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Comprobante / Orden Adjunta (Opcional)</label>
                                        <input type="file" name="archivo_adjunto" id="archivo_adjunto" class="form-control" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp">
                                        <div class="form-text text-secondary small">Permitidos: PDF (máx. 10 MB), JPG, JPEG, PNG y WEBP (máx. 5 MB).</div>
                                        <div id="archivo-actual-container" class="mt-2"></div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-25">
                                    <a href="/flota/frontend/mantenimientos/index.html" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" id="btnGuardar" class="btn btn-warning px-4 fw-semibold text-dark">
                                        <i class="bi bi-save me-1"></i> Actualizar Mantenimiento
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/flota/frontend/assets/js/app.js?v=20260927"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await App.initLayout('mantenimientos');
    if (!ok) return;

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) {
        window.location.href = '/flota/frontend/mantenimientos/index.html';
        return;
    }

    const [resMant, resVeh, resSuc] = await Promise.all([
        App.api(`/flota/backend/controllers/MantenimientoController.php?accion=obtener&id=${id}`),
        App.api('/flota/backend/controllers/VehiculoController.php?accion=listar'),
        App.api('/flota/backend/controllers/SucursalController.php?accion=listar')
    ]);

    if (!resMant || !resMant.success || !resMant.data || !resMant.data.mantenimiento) {
        App.showAlert('danger', 'Mantenimiento no encontrado.');
        setTimeout(() => window.location.href = '/flota/frontend/mantenimientos/index.html', 1500);
        return;
    }

    if (resSuc && resSuc.success && resSuc.data) {
        document.getElementById('sucursal_id').innerHTML = '<option value="">-- Selecciona la sucursal --</option>' + 
            resSuc.data.map(s => `<option value="${s.id}">${App.escapeHtml(s.nombre)}</option>`).join('');
    }

    if (resVeh && resVeh.success && resVeh.data && resVeh.data.vehiculos) {
        document.getElementById('vehiculo_id').innerHTML = '<option value="">-- Selecciona el vehículo --</option>' + 
            resVeh.data.vehiculos.map(v => `<option value="${v.id}">${App.escapeHtml(v.placa)} | ${App.escapeHtml(v.marca || '')} ${App.escapeHtml(v.modelo || '')}</option>`).join('');
    }

    const m = resMant.data.mantenimiento;
    document.getElementById('lbl-id').textContent = m.id;
    document.getElementById('mant-id').value = m.id;
    document.getElementById('vehiculo_id').value = m.vehiculo_id;
    document.getElementById('sucursal_id').value = m.sucursal_id || '';
    document.getElementById('tipo').value = m.tipo;
    document.getElementById('estado').value = m.estado;
    document.getElementById('titulo').value = m.titulo;
    document.getElementById('proveedor').value = m.proveedor || '';
    document.getElementById('descripcion').value = m.descripcion || '';
    document.getElementById('fecha_programada').value = m.fecha_programada;
    document.getElementById('fecha_realizada').value = m.fecha_realizada || '';
    document.getElementById('kilometraje_servicio').value = m.kilometraje_servicio || '';
    document.getElementById('costo').value = m.costo;
    document.getElementById('observaciones').value = m.observaciones || '';

    if (m.archivo_ruta) {
        const tamanoStr = m.archivo_tamano ? ` (${App.formatBytes(m.archivo_tamano)})` : '';
        document.getElementById('archivo-actual-container').innerHTML = `
            <div class="p-2 rounded bg-dark border border-secondary border-opacity-25 d-flex align-items-center justify-content-between">
                <span class="small text-light text-truncate me-2">
                    <i class="bi bi-paperclip text-info me-1"></i>Adjunto actual: <strong>${App.escapeHtml(m.archivo_nombre_original || m.archivo_nombre)}</strong>${tamanoStr}
                </span>
                <a href="/flota/${m.archivo_ruta}" target="_blank" class="btn btn-sm btn-outline-info py-0 px-2">
                    <i class="bi bi-eye me-1"></i>Ver
                </a>
            </div>
        `;
    }

    const form = document.getElementById('formEditarMantenimiento');
    const btnGuardar = document.getElementById('btnGuardar');
    const inputArchivoAdjunto = document.getElementById('archivo_adjunto');
    App.vincularValidacionArchivo(inputArchivoAdjunto);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (inputArchivoAdjunto && inputArchivoAdjunto.files && inputArchivoAdjunto.files[0]) {
            const valArchivo = App.validarArchivo(inputArchivoAdjunto.files[0]);
            if (!valArchivo.valido) {
                App.showAlert('danger', valArchivo.mensaje);
                inputArchivoAdjunto.classList.add('is-invalid');
                return;
            }
        }

        btnGuardar.disabled = true;
        btnGuardar.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Guardando...`;

        const formData = new FormData(form);
        formData.append('accion', 'actualizar');

        try {
            const res = await fetch('/flota/backend/controllers/MantenimientoController.php?accion=actualizar', {
                method: 'POST',
                body: formData,
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json' }
            });
            const data = await res.json();

            if (data && data.success) {
                App.flashAlert('success', data.mensaje || 'Mantenimiento actualizado.');
                window.location.href = '/flota/frontend/mantenimientos/index.html';
            } else {
                App.showAlert('danger', data.mensaje || 'Error al actualizar.');
                btnGuardar.disabled = false;
                btnGuardar.innerHTML = `<i class="bi bi-save me-1"></i> Actualizar Mantenimiento`;
            }
        } catch (err) {
            console.error(err);
            App.showAlert('danger', 'Error de conexión.');
            btnGuardar.disabled = false;
            btnGuardar.innerHTML = `<i class="bi bi-save me-1"></i> Actualizar Mantenimiento`;
        }
    });
});
</script>
</body>
</html>
