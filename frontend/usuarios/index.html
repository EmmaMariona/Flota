<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Gestión de Flota</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/flota/frontend/assets/css/estilo.css">
</head>
<body class="bg-body-tertiary">

<div class="d-flex min-vh-100 layout-wrapper">
    <div id="sidebar-container"></div>
    <div class="d-flex flex-column flex-grow-1 main-content-wrapper">
        <div id="navbar-container"></div>
        <main class="container-fluid p-4 content-area">
            <div id="alerts-container"></div>

            <div class="d-flex flex-column gap-3">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                    <div>
                        <h2 class="fw-bold mb-1">Usuarios y Control de Acceso</h2>
                        <p class="text-secondary small mb-0">Administración de cuentas y asignación de roles (Administrador, Supervisor, Consulta).</p>
                    </div>
                    <a href="/flota/frontend/usuarios/crear.html" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm">
                        <i class="bi bi-person-plus"></i> Nuevo Usuario
                    </a>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-0 table-responsive">
                        <table class="table table-custom table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Correo Electrónico</th>
                                    <th>Rol de Acceso</th>
                                    <th>Estado</th>
                                    <th>Fecha de Registro</th>
                                    <th class="text-end pe-3">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-usuarios">
                                <tr><td colspan="6" class="text-center text-secondary py-4">Cargando usuarios...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/flota/frontend/assets/js/app.js?v=20260927"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await App.initLayout('usuarios');
    if (!ok) return;

    if (App.currentUser.rol !== 'Administrador') {
        App.showAlert('danger', 'Acceso denegado: este módulo requiere rol Administrador.');
        setTimeout(() => window.location.href = '/flota/frontend/index.html', 1500);
        return;
    }

    async function cargarUsuarios() {
        const res = await App.api('/flota/backend/controllers/UsuarioController.php?accion=listar');
        const tbody = document.getElementById('tabla-usuarios');

        if (res && res.success && res.data) {
            const list = res.data;
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-secondary py-4">No hay usuarios registrados.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(u => {
                let rolClass = 'bg-info-subtle text-info';
                if (u.rol === 'Administrador') rolClass = 'bg-danger-subtle text-danger';
                if (u.rol === 'Supervisor') rolClass = 'bg-warning-subtle text-warning';

                const isCurrent = App.currentUser && App.currentUser.id == u.id;

                return `
                <tr>
                    <td>
                        <div class="fw-bold text-light d-flex align-items-center gap-2">
                            <div class="avatar rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white" style="width: 32px; height: 32px; font-size: 0.85rem;">
                                <i class="bi bi-person"></i>
                            </div>
                            ${App.escapeHtml(u.nombre)}
                            ${isCurrent ? '<span class="badge bg-primary ms-1" style="font-size: 0.65rem;">Tú</span>' : ''}
                        </div>
                    </td>
                    <td>${App.escapeHtml(u.email)}</td>
                    <td><span class="badge ${rolClass} px-2 py-1">${App.escapeHtml(u.rol)}</span></td>
                    <td>
                        <span class="badge ${u.estado === 'Activo' ? 'badge-activo' : 'badge-inactivo'} px-2 py-1">
                            ${App.escapeHtml(u.estado)}
                        </span>
                    </td>
                    <td><span class="text-secondary small">${App.formatDate(u.fecha_creacion)}</span></td>
                    <td class="text-end pe-3">
                        ${!isCurrent ? `
                        <button class="btn btn-outline-danger btn-sm btn-eliminar-usuario" data-id="${u.id}" data-nombre="${App.escapeHtml(u.nombre)}" title="Eliminar Usuario">
                            <i class="bi bi-trash"></i>
                        </button>
                        ` : '<span class="text-secondary small">En sesión</span>'}
                    </td>
                </tr>
                `;
            }).join('');

            tbody.querySelectorAll('.btn-eliminar-usuario').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.getAttribute('data-id');
                    const nombre = btn.getAttribute('data-nombre');
                    if (confirm(`¿Estás seguro de que deseas eliminar al usuario '${nombre}'?`)) {
                        const r = await App.api(`/flota/backend/controllers/UsuarioController.php?accion=eliminar&id=${id}`);
                        if (r && r.success) {
                            App.showAlert('success', 'Usuario eliminado exitosamente.');
                            cargarUsuarios();
                        } else {
                            App.showAlert('danger', r.mensaje || 'Error al eliminar usuario.');
                        }
                    }
                });
            });
        }
    }

    cargarUsuarios();
});
</script>
</body>
</html>
