<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario - Gestión de Flota</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/flota/frontend/assets/css/estilo.css">
</head>
<body class="bg-body-tertiary">

<div class="d-flex min-vh-100 layout-wrapper">
    <div id="sidebar-container"></div>
    <div class="d-flex flex-column flex-grow-1 main-content-wrapper">
        <div id="navbar-container"></div>
        <main class="container-fluid p-4 content-area">
            <div id="alerts-container"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-xl-6">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold mb-1">Registrar Nuevo Usuario</h2>
                            <p class="text-secondary small mb-0">Crea una cuenta de acceso y asigna permisos dentro del sistema.</p>
                        </div>
                        <a href="/flota/frontend/usuarios/index.html" class="btn btn-outline-secondary d-flex align-items-center gap-1">
                            <i class="bi bi-arrow-left"></i> Volver a Usuarios
                        </a>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <form id="formCrearUsuario">
                                <div class="mb-3">
                                    <label class="form-label">Nombre Completo <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                                            <i class="bi bi-person"></i>
                                        </span>
                                        <input type="text" name="nombre" class="form-control" required placeholder="Ej. Juan Pérez" autofocus>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                                            <i class="bi bi-envelope"></i>
                                        </span>
                                        <input type="email" name="email" class="form-control" required placeholder="correo@ejemplo.com">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                                            <i class="bi bi-lock"></i>
                                        </span>
                                        <input type="password" name="password" class="form-control" required placeholder="••••••••" minlength="4">
                                    </div>
                                    <div class="form-text text-secondary small">La contraseña será hasheada de forma segura con BCRYPT.</div>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Rol de Acceso <span class="text-danger">*</span></label>
                                        <select name="rol" class="form-select" required>
                                            <option value="Consulta" selected>Consulta (Solo lectura)</option>
                                            <option value="Supervisor">Supervisor (Crear y editar)</option>
                                            <option value="Administrador">Administrador (Control total)</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label class="form-label">Estado Inicial <span class="text-danger">*</span></label>
                                        <select name="estado" class="form-select" required>
                                            <option value="Activo" selected>Activo (Habilitado)</option>
                                            <option value="Inactivo">Inactivo (Bloqueado)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-25">
                                    <a href="/flota/frontend/usuarios/index.html" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" id="btnGuardar" class="btn btn-primary px-4 fw-semibold">
                                        <i class="bi bi-save me-1"></i> Guardar Usuario
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/flota/frontend/assets/js/app.js?v=20260927"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await App.initLayout('usuarios');
    if (!ok) return;

    if (App.currentUser.rol !== 'Administrador') {
        App.showAlert('danger', 'Acceso denegado.');
        setTimeout(() => window.location.href = '/flota/frontend/index.html', 1500);
        return;
    }

    const form = document.getElementById('formCrearUsuario');
    const btnGuardar = document.getElementById('btnGuardar');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btnGuardar.disabled = true;
        btnGuardar.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Guardando...`;

        const formData = new FormData(form);
        formData.append('accion', 'guardar');

        try {
            const res = await fetch('/flota/backend/controllers/UsuarioController.php?accion=guardar', {
                method: 'POST',
                body: formData,
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json' }
            });
            const data = await res.json();

            if (data && data.success) {
                App.flashAlert('success', data.mensaje || 'Usuario creado exitosamente.');
                window.location.href = '/flota/frontend/usuarios/index.html';
            } else {
                App.showAlert('danger', data.mensaje || 'Error al crear usuario.');
                btnGuardar.disabled = false;
                btnGuardar.innerHTML = `<i class="bi bi-save me-1"></i> Guardar Usuario`;
            }
        } catch (err) {
            console.error(err);
            App.showAlert('danger', 'Error de conexión con el servidor.');
            btnGuardar.disabled = false;
            btnGuardar.innerHTML = `<i class="bi bi-save me-1"></i> Guardar Usuario`;
        }
    });
});
</script>
</body>
</html>
