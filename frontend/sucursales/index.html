<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sucursales - Gestión de Flota</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/flota/frontend/assets/css/estilo.css">
</head>
<body class="bg-body-tertiary">

<div class="d-flex min-vh-100 layout-wrapper">
    <div id="sidebar-container"></div>
    <div class="d-flex flex-column flex-grow-1 main-content-wrapper">
        <div id="navbar-container"></div>
        <main class="container-fluid p-4 content-area">
            <div id="alerts-container"></div>

            <div class="d-flex flex-column gap-4">
                <!-- Encabezado -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                    <div>
                        <h2 class="fw-bold mb-1">Gestión de Sucursales</h2>
                        <p class="text-secondary small mb-0">Administra las sucursales operativas de la empresa para la asignación de vehículos y mantenimientos.</p>
                    </div>
                    <div>
                        <button type="button" class="btn btn-primary d-flex align-items-center gap-2 shadow-sm" id="btnNuevaSucursal">
                            <i class="bi bi-plus-circle"></i> Nueva Sucursal
                        </button>
                    </div>
                </div>

                <!-- Tarjeta Principal -->
                <div class="card shadow-sm">
                    <div class="card-header d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 py-3">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-geo-alt-fill text-primary"></i>
                            <span class="fw-bold">Listado de Sucursales</span>
                            <span class="badge bg-primary-subtle text-primary rounded-pill" id="badge-total-sucursales">0</span>
                        </div>
                        <div style="min-width: 260px;">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-dark border-secondary border-opacity-50 text-secondary">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" id="buscar-sucursal" class="form-control" placeholder="Buscar sucursal por nombre...">
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4" style="width: 90px;">ID</th>
                                        <th>Nombre de la Sucursal</th>
                                        <th class="text-center">Vehículos Asignados</th>
                                        <th class="text-end pe-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-sucursales">
                                    <tr>
                                        <td colspan="4" class="text-center text-secondary py-4">Cargando sucursales...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div id="footer-container"></div>
    </div>
</div>

<!-- Modal Crear / Editar Sucursal -->
<div class="modal fade" id="modalSucursal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary border-opacity-50">
            <form id="formSucursal">
                <div class="modal-header border-secondary border-opacity-25">
                    <h5 class="modal-title fw-bold" id="modalSucursalTitulo">Nueva Sucursal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="sucursal-id" name="id">
                    <div class="mb-3">
                        <label for="sucursal-nombre" class="form-label">Nombre de la Sucursal <span class="text-danger">*</span></label>
                        <input type="text" id="sucursal-nombre" name="nombre" class="form-control" required placeholder="Ej. San Pedro Sula, Tegucigalpa, Choloma...">
                    </div>
                </div>
                <div class="modal-footer border-secondary border-opacity-25">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" id="btnGuardarSucursal" class="btn btn-primary fw-semibold">
                        <i class="bi bi-save me-1"></i> Guardar Sucursal
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/flota/frontend/assets/js/app.js?v=20260927_s"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const ok = await App.initLayout('sucursales');
    if (!ok) return;

    let listaSucursales = [];
    const modalEl = document.getElementById('modalSucursal');
    const modalSucursal = new bootstrap.Modal(modalEl);
    const inputBuscar = document.getElementById('buscar-sucursal');

    async function cargarSucursales() {
        const res = await App.api('/flota/backend/controllers/SucursalController.php?accion=listar');
        if (!res || !res.success || !Array.isArray(res.data)) {
            App.showAlert('danger', 'No se pudo cargar el listado de sucursales.');
            return;
        }
        listaSucursales = res.data;
        renderSucursales();
    }

    function renderSucursales() {
        const q = inputBuscar.value.trim().toLowerCase();
        const filtradas = listaSucursales.filter(s => !q || s.nombre.toLowerCase().includes(q));

        document.getElementById('badge-total-sucursales').textContent = filtradas.length;
        const tbody = document.getElementById('tabla-sucursales');

        if (filtradas.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-secondary py-4">No se encontraron sucursales.</td></tr>`;
            return;
        }

        tbody.innerHTML = filtradas.map(s => {
            const totalVeh = Number(s.total_vehiculos || 0);
            return `
                <tr>
                    <td class="ps-4 text-secondary small">#${s.id}</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-geo-alt text-primary"></i>
                            <span class="fw-bold text-light">${App.escapeHtml(s.nombre)}</span>
                        </div>
                    </td>
                    <td class="text-center">
                        <span class="badge ${totalVeh > 0 ? 'bg-info-subtle text-info' : 'bg-secondary-subtle text-secondary'}">
                            <i class="bi bi-truck me-1"></i>${totalVeh} unidad${totalVeh === 1 ? '' : 'es'}
                        </span>
                    </td>
                    <td class="text-end pe-4">
                        <div class="d-inline-flex gap-1">
                            <button type="button" class="btn btn-sm btn-outline-light py-1 px-2 btn-editar"
                                data-id="${s.id}"
                                data-nombre="${App.escapeHtml(s.nombre)}"
                                title="Editar sucursal">
                                <i class="bi bi-pencil me-1"></i>Editar
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger py-1 px-2 btn-eliminar"
                                data-id="${s.id}"
                                data-nombre="${App.escapeHtml(s.nombre)}"
                                data-vehiculos="${totalVeh}"
                                title="Eliminar sucursal">
                                <i class="bi bi-trash me-1"></i>Eliminar
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');

        tbody.querySelectorAll('.btn-editar').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('modalSucursalTitulo').textContent = 'Editar Sucursal';
                document.getElementById('sucursal-id').value = btn.getAttribute('data-id');
                document.getElementById('sucursal-nombre').value = btn.getAttribute('data-nombre');
                modalSucursal.show();
            });
        });

        tbody.querySelectorAll('.btn-eliminar').forEach(btn => {
            btn.addEventListener('click', async () => {
                const id = btn.getAttribute('data-id');
                const nombre = btn.getAttribute('data-nombre');
                const totalVeh = Number(btn.getAttribute('data-vehiculos') || 0);

                const avisoExtra = totalVeh > 0
                    ? `\n\nNota: Los ${totalVeh} vehículo(s) asignados pasarán a estado "Sin sucursal".`
                    : '';

                if (!confirm(`¿Estás seguro de que deseas eliminar la sucursal "${nombre}"?${avisoExtra}`)) {
                    return;
                }

                const res = await App.api('/flota/backend/controllers/SucursalController.php?accion=eliminar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: Number(id) })
                });

                if (res && res.success) {
                    App.showAlert('success', res.mensaje || 'Sucursal eliminada correctamente.');
                    await cargarSucursales();
                } else {
                    App.showAlert('danger', res.mensaje || 'Error al eliminar la sucursal.');
                }
            });
        });
    }

    inputBuscar.addEventListener('input', renderSucursales);

    document.getElementById('btnNuevaSucursal').addEventListener('click', () => {
        document.getElementById('modalSucursalTitulo').textContent = 'Crear Nueva Sucursal';
        document.getElementById('sucursal-id').value = '';
        document.getElementById('sucursal-nombre').value = '';
        modalSucursal.show();
    });

    document.getElementById('formSucursal').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('sucursal-id').value;
        const nombre = document.getElementById('sucursal-nombre').value.trim();
        const accion = id ? 'actualizar' : 'guardar';

        const btn = document.getElementById('btnGuardarSucursal');
        btn.disabled = true;

        const res = await App.api(`/flota/backend/controllers/SucursalController.php?accion=${accion}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id ? Number(id) : undefined, nombre })
        });

        btn.disabled = false;
        if (res && res.success) {
            modalSucursal.hide();
            App.showAlert('success', res.mensaje);
            await cargarSucursales();
        } else {
            App.showAlert('danger', res.mensaje || 'Error al guardar la sucursal.');
        }
    });

    await cargarSucursales();
});
</script>
</body>
</html>
