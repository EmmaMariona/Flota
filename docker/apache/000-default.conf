<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/flota

    # Permitir acceso tanto con el prefijo /flota/ como directamente desde la raíz
    Alias /flota /var/www/html/flota

    <Directory /var/www/html/flota>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php frontend/index.html index.html
    </Directory>

    <Directory /var/www/html/flota/backend/uploads>
        Options -Indexes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    # Configuración de Logs
    ErrorLog ${APACHE_LOG_DIR}/flota_error.log
    CustomLog ${APACHE_LOG_DIR}/flota_access.log combined
</VirtualHost>
